<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shape -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Outer Glow Hexagon -->
  <polygon points="256,64 420,160 420,352 256,448 92,352 92,160" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.3" filter="url(#glow)" />
  
  <!-- Main Styled Hexagon Shield -->
  <polygon points="256,80 404,166 404,346 256,432 108,346 108,166" fill="url(#primaryGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.1" />
  
  <!-- Futuristic grid lines -->
  <path d="M256,80 L256,432 M108,166 L404,346 M108,346 L404,166" stroke="#ffffff" stroke-dasharray="8,8" stroke-opacity="0.15" stroke-width="2" />
  
  <!-- Inner core glowing element (Abstract shopping bag / terminal card shape) -->
  <g transform="translate(196, 196)">
    <!-- Main Card Body -->
    <rect width="120" height="80" rx="12" fill="#090d16" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)" />
    <!-- EMV Chip shape -->
    <rect x="20" y="24" width="28" height="22" rx="4" fill="url(#accentGrad)" />
    <!-- Magnetic stripe / tech detail -->
    <line x1="20" y1="58" x2="100" y2="58" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
    <circle cx="90" cy="32" r="8" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="100" cy="32" r="8" fill="#ffffff" fill-opacity="0.3" />
  </g>
  
  <!-- Floating dynamic stars/dots for premium look -->
  <circle cx="256" cy="120" r="6" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="150" cy="300" r="4" fill="#6366f1" />
  <circle cx="362" cy="300" r="5" fill="#3b82f6" />
</svg>
